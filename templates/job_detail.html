{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-10">

    <!-- Back button -->
    <a href="{{ url_for('main.home') }}" class="inline-flex items-center text-blue-600 hover:text-blue-800 mb-6">
        ← Back to Jobs
    </a>

    <!-- Job Card -->
    <div class="bg-white shadow rounded-xl p-6 border">
        <div class="flex justify-between items-start mb-3">
            <h1 class="text-3xl font-bold text-gray-800">{{ job.title }}</h1>

            <!-- Save / Unsave button -->
            <form method="POST" action="{{ url_for('saved.toggle_save', job_id=job.id) }}">
                <input type="hidden" name="next" value="{{ request.path }}">
                <button type="submit"
                    class="px-3 py-1.5 text-sm font-medium rounded-lg border transition whitespace-nowrap
                    {% if is_saved %}bg-red-50 text-red-600 border-red-300 hover:bg-red-100{% else %}bg-gray-50 text-gray-600 border-gray-300 hover:bg-gray-100{% endif %}">
                    {% if is_saved %}♥ Saved{% else %}♡ Save{% endif %}
                </button>
            </form>
        </div>

        <div class="space-y-2 mb-6">
            <p class="text-gray-700"><span class="font-semibold">Employer:</span> {{ job.employer }}</p>
            <p class="text-gray-700"><span class="font-semibold">Location:</span> {{ job.location }}</p>
            <p class="text-green-600 font-medium"><span class="font-semibold">Salary:</span> {{ job.salary }}</p>
            <p class="text-gray-700"><span class="font-semibold">Phone:</span> {{ job.phone }}</p>
        </div>

        <!-- Contact buttons -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <a href="tel:{{ job.phone }}"
                class="block w-full text-center bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition">
                📞 Call Employer
            </a>
            {% if whatsapp_link %}
            <a href="{{ whatsapp_link }}" target="_blank" rel="noopener"
                class="block w-full text-center bg-green-600 text-white py-3 rounded-lg font-medium hover:bg-green-700 transition">
                💬 WhatsApp Employer
            </a>
            {% endif %}
        </div>
    </div>

    <!-- Google Map Embed -->
    <div class="mt-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-2">Location on Map</h2>
        <iframe width="100%" height="300" style="border:0; border-radius: 0.5rem;" loading="lazy" allowfullscreen
            src="https://www.google.com/maps?q={{ job.location | urlencode }}&output=embed">
        </iframe>
    </div>

</div>
{% endblock %}
